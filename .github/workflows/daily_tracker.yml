name: eToro Portfolio Daily Tracker

on:
  schedule:
    # 每日定時執行 (UTC 22:17, 23:17, 00:17, 01:17 = 台灣時間 UTC+8 每日清晨 06:17, 07:17, 08:17, 09:17 多重保險，自動防重複發信)
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
    - cron: '17 0 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發執行
    inputs:
      force_notify:
        description: '強制發送推播通知 (忽略今日已通知標記)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track-and-update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Taipei'

    steps:
      - name: 檢出專案代碼 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境 (Setup Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 eToro 爬蟲與調倉分析 (Run Tracker)
        env:
          TARGET_USERNAME: ${{ vars.TARGET_USERNAME || 'miulatw' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES_URL: ${{ secrets.PAGES_URL || vars.PAGES_URL || 'https://fanchenchun.github.io/etoro/' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_notify != false) }}
        run: |
          EXTRA_ARGS=""
          if [ "$FORCE_NOTIFY" = "true" ]; then
            EXTRA_ARGS="--force-notify"
          fi
          python src/main.py $EXTRA_ARGS

      - name: 提交並推送更新至儲存庫 (Commit & Push Changes)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git status
          if [ -n "$(git status --porcelain data/ index.html)" ]; then
            git add data/latest.json data/history.json index.html
            git commit -m "chore(data): auto-update etoro portfolio & dashboard [$(date +'%Y-%m-%d')]"
            git pull --rebase --autostash origin main || true
            git push origin main
            echo "✅ 成功更新資料與 index.html 並推送到儲存庫！"
          else
            echo "⚡ 今日無資料變動，無需提交。"
          fi
