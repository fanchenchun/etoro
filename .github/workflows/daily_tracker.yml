name: eToro Portfolio Daily Tracker

on:
  schedule:
    # 每日定時執行 (UTC 22:00 = 台灣時間 UTC+8 每日清晨 06:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發執行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境 (Setup Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright 瀏覽器核心 (Install Playwright Chromium)
        run: |
          playwright install chromium --with-deps

      - name: 執行 eToro 爬蟲與調倉分析 (Run Tracker)
        env:
          TARGET_USERNAME: ${{ vars.TARGET_USERNAME || 'miulatw' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES_URL: ${{ secrets.PAGES_URL || vars.PAGES_URL }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/main.py

      - name: 提交並推送更新至儲存庫 (Commit & Push Changes)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有檔案變動
          if [ -n "$(git status --porcelain data/ index.html)" ]; then
            git add data/latest.json data/history.json index.html
            git commit -m "chore(data): auto-update etoro portfolio & dashboard [$(date +'%Y-%m-%d')]"
            git push
            echo "✅ 成功更新資料與 index.html 並推送到儲存庫！"
          else
            echo "⚡ 今日無資料變動，無需提交。"
          fi
