name: eToro Portfolio Daily Tracker

on:
  schedule:
    # 台灣時間週二至週六 (對應美股週一至週五交易日隔天清晨)
    # 主要排程: 台灣時間 08:00 (UTC 00:00)
    # 備用重試排程: 08:30, 09:00, 09:30, 10:00 (若 08:00 已成功執行並送出通知，後續重試將自動安全秒速退出，絕不重複發信)
    - cron: '0 0 * * 2-6'   # 台灣時間 08:00 (主要)
    - cron: '30 0 * * 2-6'  # 台灣時間 08:30 (備用重試 1)
    - cron: '0 1 * * 2-6'   # 台灣時間 09:00 (備用重試 2)
    - cron: '30 1 * * 2-6'  # 台灣時間 09:30 (備用重試 3)
    - cron: '0 2 * * 2-6'   # 台灣時間 10:00 (備用重試 4)
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發執行
    inputs:
      force_notify:
        description: '強制發送推播通知 (忽略今日已通知標記)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track-and-update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Taipei'

    steps:
      - name: 檢出專案代碼 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境 (Setup Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 eToro 爬蟲與調倉分析 (Run Tracker with Retry)
        env:
          TARGET_USERNAME: ${{ vars.TARGET_USERNAME || 'all' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES_URL: ${{ secrets.PAGES_URL || vars.PAGES_URL || 'https://fanchenchun.github.io/etoro/' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_notify != false) }}
        run: |
          EXTRA_ARGS=""
          if [ "$FORCE_NOTIFY" = "true" ]; then
            EXTRA_ARGS="--force-notify"
          fi

          # 執行追蹤程序，具備單次 Job 內部重試 (最多嘗試 2 次，間隔 30 秒)
          MAX_RETRIES=2
          RETRY_COUNT=0
          SUCCESS=0

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            echo "▶ 正在執行 eToro 追蹤程序 (嘗試 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if python src/main.py $EXTRA_ARGS; then
              SUCCESS=1
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⚠️ 執行異常，等待 30 秒後進行第 $((RETRY_COUNT+1)) 次重試..."
              sleep 30
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ 本次 Job 重試後仍未成功，將依賴後續備用排程再次嘗試。"
            exit 1
          fi

      - name: 提交並推送更新至儲存庫 (Commit & Push Changes)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git status
          if [ -n "$(git status --porcelain data/ *.html)" ]; then
            git add data/ *.html
            git commit -m "chore(data): auto-update etoro portfolios & dashboards [$(date +'%Y-%m-%d')]"
            git pull --rebase --autostash origin main || true
            git push origin main
            echo "✅ 成功更新資料與所有儀表板網頁並推送到儲存庫！"
          else
            echo "⚡ 今日無資料變動，無需提交。"
          fi
